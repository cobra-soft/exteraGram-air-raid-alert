name = "old-art-1d92"
main = "worker.js"
compatibility_date = "2024-01-01"
keep_vars = true

kv_namespaces = [
  { binding = "USERS", id = "<KV_NAMESPACE_ID>" }
]

d1_databases = [
  { binding = "DB", database_name = "air-raid-cache", database_id = "<D1_DATABASE_ID>" }
]

[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "production"
